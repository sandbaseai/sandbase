[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbase"
version = "0.1.0"
description = "Call every SandBase model and API with one key: sync and async runs, polling, costs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Homepage = "https://www.sandbase.ai"
Source = "https://github.com/sandbaseai/sandbase"

[tool.setuptools]
packages = ["sandbase"]
