name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go
        working-directory: sdk/go
        run: go vet ./... && go test ./...
      - name: TypeScript
        working-directory: sdk/typescript
        run: npm install --no-audit --no-fund && npm test
      - name: Python
        run: python -c "import sys; sys.path.insert(0, 'sdk/python'); import sandbase; print(sandbase.__version__)"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --verbose
